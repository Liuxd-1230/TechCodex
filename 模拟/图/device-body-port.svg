<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 390" width="480" height="390" role="img"><title>体效应扫描：移动源端，保持栅源和漏源电压</title><desc>V0体效应归档测试的四个端口。B接地，S从0扫描至0.8伏，G等于S加0.9伏，D等于S加1.65伏。栅源和漏源电压保持固定；不是固定栅极对地电压的源跟随器测试。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;stroke:none}path,circle{vector-effect:non-scaling-stroke}</style><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#203b4a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><text x="22" y="30" font-size="22" fill="#203b4a" text-anchor="start">只改变源体偏置，其他相对电压不变</text><path d="M195 159L195 221" stroke="#203b4a"/><path d="M220 159L220 178" stroke="#203b4a"/><path d="M220 184L220 196" stroke="#203b4a"/><path d="M220 202L220 221" stroke="#203b4a"/><path d="M220 165L250 165" stroke="#203b4a"/><path d="M250 165L250 130" stroke="#203b4a"/><path d="M220 215L250 215" stroke="#203b4a"/><path d="M250 215L250 250" stroke="#203b4a"/><path d="M145 190L195 190" stroke="#203b4a"/><path d="M315 190L237 190" stroke="#a46723"/><path d="M237 190L222 190" stroke="#a46723"/><path d="M232.0 194.0L222 190L232.0 186.0" stroke="#a46723"/><text x="188" y="148" font-size="17" fill="#203b4a" text-anchor="start">M1 N</text><text x="259" y="144" font-size="15" fill="#203b4a" text-anchor="start">D</text><text x="259" y="243" font-size="15" fill="#203b4a" text-anchor="start">S</text><text x="144" y="180" font-size="15" fill="#203b4a" text-anchor="start">G</text><text x="304" y="179" font-size="15" fill="#a46723" text-anchor="start">B</text><path d="M250 130L250 78" stroke="#203b4a"/><text x="250" y="61" font-size="20" fill="#203b4a" text-anchor="middle">D：VS + 1.65 V</text><path d="M30 190L145 190" stroke="#203b4a"/><text x="22" y="155" font-size="20" fill="#203b4a" text-anchor="start">G：VS + 0.90 V</text><path d="M250 250L250 300" stroke="#203b4a"/><circle cx="250" cy="300" r="3.5" fill="#203b4a" stroke="none"/><text x="250" y="331" font-size="21" fill="#127b70" text-anchor="middle">S：VS = 0 → 0.8 V</text><path d="M315 190L420 190" stroke="#a46723"/><path d="M420 190L420 245" stroke="#a46723"/><path d="M420 245L420 253" stroke="#a46723"/><path d="M407 253L433 253" stroke="#a46723"/><path d="M412 260L428 260" stroke="#a46723"/><path d="M417 267L423 267" stroke="#a46723"/><text x="355" y="290" font-size="20" fill="#a46723" text-anchor="start">B = 0</text><path d="M285 90L285 125" stroke="#127b70"/><path d="M289.0 115.0L285 125L281.0 115.0" stroke="#127b70"/><text x="306" y="119" font-size="20" fill="#127b70" text-anchor="start">ID</text><text x="22" y="375" font-size="19" fill="#5a7381" text-anchor="start">VGS = 0.90 V；VDS = 1.65 V；VSB = VS。</text></g></svg>
