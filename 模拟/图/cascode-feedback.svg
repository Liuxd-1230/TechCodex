<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 610" width="480" height="610" role="img"><title>共源共栅输出测试：中间节点使两种电流变化相抵</title><desc>已置零输入的两管共源共栅增量模型。M1只剩ro1，M2栅体交流接地。gt2为1毫西门子，ro1与ro2均100千欧。输出测试100毫伏使中间节点上升0.980392毫伏，M2输出电导项增加0.990196微安，跨导项减少0.980392微安，净向下电流9.80392纳安。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;stroke:none}path,circle{vector-effect:non-scaling-stroke}</style><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#203b4a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><text x="22" y="30" font-size="22" fill="#203b4a" text-anchor="start">输出抬高，支路电流为何只变一点</text><path d="M160 149L160 211" stroke="#203b4a"/><path d="M185 149L185 168" stroke="#203b4a"/><path d="M185 174L185 186" stroke="#203b4a"/><path d="M185 192L185 211" stroke="#203b4a"/><path d="M185 155L215 155" stroke="#203b4a"/><path d="M215 155L215 120" stroke="#203b4a"/><path d="M185 205L215 205" stroke="#203b4a"/><path d="M215 205L215 240" stroke="#203b4a"/><path d="M110 180L160 180" stroke="#203b4a"/><path d="M280 180L202 180" stroke="#a46723"/><path d="M202 180L187 180" stroke="#a46723"/><path d="M197.0 184.0L187 180L197.0 176.0" stroke="#a46723"/><text x="153" y="138" font-size="17" fill="#203b4a" text-anchor="start">M2 N</text><text x="224" y="134" font-size="15" fill="#203b4a" text-anchor="start">D</text><text x="224" y="233" font-size="15" fill="#203b4a" text-anchor="start">S</text><text x="109" y="170" font-size="15" fill="#203b4a" text-anchor="start">G</text><text x="269" y="169" font-size="15" fill="#a46723" text-anchor="start">B</text><path d="M215 120L215 85" stroke="#203b4a"/><path d="M215 85L432 85" stroke="#203b4a"/><circle cx="215" cy="85" r="3.5" fill="#203b4a" stroke="none"/><text x="432" y="65" font-size="21" fill="#127b70" text-anchor="end">vo = +100 mV</text><path d="M110 180L55 180" stroke="#203b4a"/><path d="M55 180L55 215" stroke="#203b4a"/><path d="M55 215L55 223" stroke="#203b4a"/><path d="M42 223L68 223" stroke="#203b4a"/><path d="M47 230L63 230" stroke="#203b4a"/><path d="M52 237L58 237" stroke="#203b4a"/><text x="22" y="152" font-size="18" fill="#203b4a" text-anchor="start">vg2 = 0</text><path d="M280 180L365 180" stroke="#a46723"/><path d="M365 180L365 215" stroke="#a46723"/><path d="M365 215L365 223" stroke="#a46723"/><path d="M352 223L378 223" stroke="#a46723"/><path d="M357 230L373 230" stroke="#a46723"/><path d="M362 237L368 237" stroke="#a46723"/><text x="340" y="267" font-size="18" fill="#a46723" text-anchor="start">vb2 = 0</text><path d="M215 240L215 280" stroke="#203b4a"/><path d="M215 280L350 280" stroke="#203b4a"/><circle cx="215" cy="280" r="3.5" fill="#203b4a" stroke="none"/><text x="246" y="310" font-size="20" fill="#127b70" text-anchor="start">vx = +0.980 mV</text><path d="M215 280L215 325" stroke="#203b4a"/><path d="M215 325L215 335" stroke="#203b4a"/><path d="M215 335L208 340.0" stroke="#203b4a"/><path d="M208 340.0L222 347.6666666666667" stroke="#203b4a"/><path d="M222 347.6666666666667L208 355.3333333333333" stroke="#203b4a"/><path d="M208 355.3333333333333L222 363.0" stroke="#203b4a"/><path d="M222 363.0L208 370.6666666666667" stroke="#203b4a"/><path d="M208 370.6666666666667L222 378.3333333333333" stroke="#203b4a"/><path d="M222 378.3333333333333L215 391" stroke="#203b4a"/><path d="M215 391L215 401" stroke="#203b4a"/><path d="M215 401L215 409" stroke="#203b4a"/><path d="M202 409L228 409" stroke="#203b4a"/><path d="M207 416L223 416" stroke="#203b4a"/><path d="M212 423L218 423" stroke="#203b4a"/><text x="245" y="373" font-size="18" fill="#203b4a" text-anchor="start">ro1 = 100 kΩ</text><path d="M172 323L172 382" stroke="#127b70"/><path d="M176.0 372.0L172 382L168.0 372.0" stroke="#127b70"/><text x="22" y="345" font-size="19" fill="#127b70" text-anchor="start">ix =</text><text x="22" y="374" font-size="20" fill="#127b70" text-anchor="start">+9.80 nA</text><text x="22" y="467" font-size="21" fill="#203b4a" text-anchor="start">ro2 路径：+0.990 µA</text><text x="22" y="501" font-size="21" fill="#127b70" text-anchor="start">−gt2 vx：−0.980 µA</text><text x="22" y="538" font-size="22" fill="#127b70" text-anchor="start">净变化仅 +0.00980 µA</text><text x="22" y="582" font-size="19" fill="#203b4a" text-anchor="start">Rcas = 10.2 MΩ；单管 ro1 仅 0.1 MΩ。</text></g></svg>
