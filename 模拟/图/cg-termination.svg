<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" width="480" height="720" role="img"><title>同一共栅工作点，漏端终接改变输入电流</title><desc>固定工作点的低频增量对照，gm加gmb等于1毫西门子，ro等于100千欧，栅体交流固定。上图漏端交流短接，源端注入1毫伏，输入电流1.01微安；下图只将漏端改为交流开路，漏端上升101毫伏，输入电流为零。直流偏置路径均在增量图之外。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;stroke:none}path,circle{vector-effect:non-scaling-stroke}</style><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#203b4a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><text x="22" y="30" font-size="22" fill="#203b4a" text-anchor="start">源端同样抬高 1 mV，电流却不同</text><g transform="translate(0 55)"><text x="22" y="20" font-size="22" fill="#203b4a" text-anchor="start">漏端交流短接</text><path d="M185 114L185 176" stroke="#203b4a"/><path d="M210 114L210 133" stroke="#203b4a"/><path d="M210 139L210 151" stroke="#203b4a"/><path d="M210 157L210 176" stroke="#203b4a"/><path d="M210 120L240 120" stroke="#203b4a"/><path d="M240 120L240 85" stroke="#203b4a"/><path d="M210 170L240 170" stroke="#203b4a"/><path d="M240 170L240 205" stroke="#203b4a"/><path d="M135 145L185 145" stroke="#203b4a"/><path d="M305 145L227 145" stroke="#a46723"/><path d="M227 145L212 145" stroke="#a46723"/><path d="M222.0 149.0L212 145L222.0 141.0" stroke="#a46723"/><text x="178" y="103" font-size="17" fill="#203b4a" text-anchor="start">M N</text><text x="249" y="99" font-size="15" fill="#203b4a" text-anchor="start">D</text><text x="249" y="198" font-size="15" fill="#203b4a" text-anchor="start">S</text><text x="134" y="135" font-size="15" fill="#203b4a" text-anchor="start">G</text><text x="294" y="134" font-size="15" fill="#a46723" text-anchor="start">B</text><path d="M240 85L240 65" stroke="#203b4a"/><path d="M240 65L420 65" stroke="#203b4a"/><path d="M420 65L420 73" stroke="#203b4a"/><path d="M407 73L433 73" stroke="#203b4a"/><path d="M412 80L428 80" stroke="#203b4a"/><path d="M417 87L423 87" stroke="#203b4a"/><text x="270" y="48" font-size="20" fill="#127b70" text-anchor="start">vo = 0</text><path d="M135 145L70 145" stroke="#203b4a"/><path d="M70 145L70 190" stroke="#203b4a"/><path d="M70 190L70 198" stroke="#203b4a"/><path d="M57 198L83 198" stroke="#203b4a"/><path d="M62 205L78 205" stroke="#203b4a"/><path d="M67 212L73 212" stroke="#203b4a"/><text x="22" y="126" font-size="18" fill="#203b4a" text-anchor="start">vg = 0</text><path d="M305 145L390 145" stroke="#a46723"/><path d="M390 145L390 190" stroke="#a46723"/><path d="M390 190L390 198" stroke="#a46723"/><path d="M377 198L403 198" stroke="#a46723"/><path d="M382 205L398 205" stroke="#a46723"/><path d="M387 212L393 212" stroke="#a46723"/><text x="325" y="232" font-size="18" fill="#a46723" text-anchor="start">vb = 0</text><path d="M240 205L240 250" stroke="#203b4a"/><path d="M240 250L75 250" stroke="#203b4a"/><circle cx="240" cy="250" r="3.5" fill="#203b4a" stroke="none"/><path d="M90 250L145 250" stroke="#127b70"/><path d="M135.0 246.0L145 250L135.0 254.0" stroke="#127b70"/><text x="22" y="278" font-size="20" fill="#127b70" text-anchor="start">vi = +1 mV</text><text x="230" y="278" font-size="20" fill="#127b70" text-anchor="start">ii = +1.01 µA</text><text x="22" y="310" font-size="20" fill="#203b4a" text-anchor="start">Rin = 0.990 kΩ</text></g><g transform="translate(0 385)"><text x="22" y="20" font-size="22" fill="#203b4a" text-anchor="start">漏端交流开路</text><path d="M185 114L185 176" stroke="#203b4a"/><path d="M210 114L210 133" stroke="#203b4a"/><path d="M210 139L210 151" stroke="#203b4a"/><path d="M210 157L210 176" stroke="#203b4a"/><path d="M210 120L240 120" stroke="#203b4a"/><path d="M240 120L240 85" stroke="#203b4a"/><path d="M210 170L240 170" stroke="#203b4a"/><path d="M240 170L240 205" stroke="#203b4a"/><path d="M135 145L185 145" stroke="#203b4a"/><path d="M305 145L227 145" stroke="#a46723"/><path d="M227 145L212 145" stroke="#a46723"/><path d="M222.0 149.0L212 145L222.0 141.0" stroke="#a46723"/><text x="178" y="103" font-size="17" fill="#