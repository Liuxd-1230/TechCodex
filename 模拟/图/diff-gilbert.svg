<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img"><title>Gilbert 单元：两对电流以相反极性汇入输出</title><desc>TechCodex original teaching schematic. D, G, S, B are explicitly distinguished. Colored arrows show perturbations, not wires.</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;stroke:none}path,circle{vector-effect:non-scaling-stroke}</style><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#203b4a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><text x="32" y="32" font-size="18" fill="#5a7381" text-anchor="start">同名 OL / OR 为同一网络；省去交叉长导线。</text><text x="180" y="65" font-size="18" fill="#203b4a" text-anchor="middle">VDD</text><path d="M180 85L180 95" stroke="#203b4a"/><path d="M180 95L173 100.0" stroke="#203b4a"/><path d="M173 100.0L187 107.66666666666667" stroke="#203b4a"/><path d="M187 107.66666666666667L173 115.33333333333333" stroke="#203b4a"/><path d="M173 115.33333333333333L187 123.0" stroke="#203b4a"/><path d="M187 123.0L173 130.66666666666666" stroke="#203b4a"/><path d="M173 130.66666666666666L187 138.33333333333334" stroke="#203b4a"/><path d="M187 138.33333333333334L180 151" stroke="#203b4a"/><path d="M180 151L180 161" stroke="#203b4a"/><text x="198" y="129.0" font-size="19" fill="#203b4a" text-anchor="start">RD</text><path d="M180 161L180 185" stroke="#203b4a"/><circle cx="180" cy="185" r="3.5" fill="#203b4a" stroke="none"/><text x="165" y="210" font-size="19" fill="#127b70" text-anchor="start">OL</text><text x="420" y="65" font-size="18" fill="#203b4a" text-anchor="middle">VDD</text><path d="M420 85L420 95" stroke="#203b4a"/><path d="M420 95L413 100.0" stroke="#203b4a"/><path d="M413 100.0L427 107.66666666666667" stroke="#203b4a"/><path d="M427 107.66666666666667L413 115.33333333333333" stroke="#203b4a"/><path d="M413 115.33333333333333L427 123.0" stroke="#203b4a"/><path d="M427 123.0L413 130.66666666666666" stroke="#203b4a"/><path d="M413 130.