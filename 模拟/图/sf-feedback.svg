      @media print {
#sf-feedback-root .diagram-container { overflow:visible }
}</style><marker id="sf-feedback-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#566976"/></marker><marker id="sf-feedback-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#126e63"/></marker><marker id="sf-feedback-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#315bc5"/></marker></defs>
<rect width="320" height="504" fill="#ffffff"/>
<text x="160" y="26" font-size="17" fill="#173c50" text-anchor="middle" font-weight="600">电流怎样把源极抬高？</text><g fill="none" stroke="#173c50" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M75 133L75 195" stroke="#203b4a"/><path d="M100 133L100 152" stroke="#203b4a"/><path d="M100 158L100 170" stroke="#203b4a"/><path d="M100 176L100 195" stroke="#203b4a"/><path d="M100 139L130 139" stroke="#203b4a"/><path d="M130 139L130 104" stroke="#203b4a"/><path d="M100 189L130 189" stroke="#203b4a"/><path d="M130 189L130 224" stroke="#203b4a"/><path d="M25 164L75 164" stroke="#203b4a"/><path d="M195 164L117 164" stroke="#a46723"/><path d="M117 164L102 164" stroke="#a46723"/><path d="M112.0 168.0L102 164L112.0 160.0" stroke="#a46723"/><text x="68" y="122" font-size="17" fill="#203b4a" text-anchor="start">M1 N</text><text x="139" y="118" font-size="15" fill="#203b4a" text-anchor="start">D</text><text x="139" y="217" font-size="15" fill="#203b4a" text-anchor="start">S</text><text x="24" y="154" font-size="15" fill="#203b4a" text-anchor="start">G</text><text x="184" y="153" font-size="15" fill="#a46723" text-anchor="start">B</text><path d="M130 64L130 104" stroke="#203b4a"/><text x="130" y="52" font-size="16" fill="#203b4a" text-anchor="middle">VDD</text><text x="24" y="140" font-size="17" fill="#126e63" text-anchor="start">vi ↑</text><path d="M195 164L210 164" stroke="#a46723"/><path d="M210 164L210 200" stroke="#a46723"/><path d="M210 200L210 208" stroke="#a46723"/><path d="M197 208L223 208" stroke="#a46723"/><path d="M202 215L218 215" stroke="#a46723"/><path d="M207 222L213 222" stroke="#a46723"/><path d="M130 224L130 248" stroke="#203b4a"/><circle cx="130" cy="248" r="3.5" fill="#203b4a" stroke="none"/><path d="M130 248L248 248" stroke="#203b4a"/><path d="M248 248L248 264" stroke="#203b4a"/><path d="M248 264L248 289" stroke="#203b4a"/><path d="M234 289L262 289" stroke="#203b4a"/><path d="M234 297L262 297" stroke="#203b4a"/><path d="M248 297L248 324" stroke="#203b4a"/><path d="M248 324L248 332" stroke="#203b4a"/><path d="M235 332L261 332" stroke="#203b4a"/><path d="M240 339L256 339" stroke="#203b4a"/><path d="M245 346L251 346" stroke="#203b4a"/><text x="268" y="300" font-size="15" fill="#203b4a" text-anchor="start">CL</text><text x="248" y="234" font-size="17" fill="#126e63" text-anchor="middle">vo ↑</text><path d="M130 248L130 276" stroke="#203b4a"/><path d="M130 276L130 291" stroke="#203b4a"/><circle cx="130" cy="318" r="25"/><path d="M130 306L130 330" stroke="#203b4a"/><path d="M134.0 320.0L130 330L126.0 320.0" stroke="#203b4a"/><path d="M130 345L130 360" stroke="#203b4a"/><path d="M130 360L130 368" stroke="#203b4a"/><path d="M117 368L143 368" stroke="#203b4a"/><path d="M122 375L138 375" stroke="#203b4a"/><path d="M127 382L133 382" stroke="#203b4a"/><text x="166" y="323" font-size="15" fill="#203b4a" text-anchor="start">IB 不变</text><path d="M162 94L162 128" stroke="#126e63"/><path d="M166.0 118.0L162 128L158.0 118.0" stroke="#126e63"/><text x="182" y="104" font-size="15" fill="#126e63" text-anchor="start">iD 增加</text><path d="M164 236L218 236" stroke="#315bc5"/><path d="M208.0 232.0L218 236L208.0 240.0" stroke="#315bc5"/><text x="24" y="426" font-size="15" fill="#203b4a" text-anchor="start">多出的电流流进 CL，输出升高。</text><text x="24" y="454" font-size="15" fill="#126e63" text-anchor="start">vo ↑ → vgs = vi − vo 减小</text><text x="24" y="486" font-size="14" fill="#203b4a" text-anchor="start">直到 iD 回到 IB，净充电电流为零。</text></g>
