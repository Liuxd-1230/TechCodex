<title id="sf-feedback-title">源跟随器的充电与反作用</title><desc id="sf-feedback-desc">NMOS 源极连接偏置电流源与输出电容，输入抬高使多出的漏电流给电容充电，源极升高又减小栅源电压增量。</desc><defs>
