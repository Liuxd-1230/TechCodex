<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 644" role="img" aria-labelledby="sf-feedback-title sf-feedback-desc" id="sf-feedback-root">
<title id="sf-feedback-title">源跟随器的局部纠偏路径</title><desc id="sf-feedback-desc">栅源电压增量增加沟道电流，净电流给输出电容充电，源极抬高又减小栅源电压增量，直至电流重新平衡。</desc><defs>
      <style>#sf-feedback-root { color: #173c50; font-family: "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif; }
      #sf-feedback-root .diagram-container { max-width:420px;min-width:0;margin:auto;overflow-x:auto }
      #sf-feedback-root text { font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif }
      @media print {
#sf-feedback-root .diagram-container { overflow:visible }
}</style><marker id="sf-feedback-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#566976"/></marker><marker id="sf-feedback-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#126e63"/></marker><marker id="sf-feedback-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#315bc5"/></marker></defs>
<rect width="320" height="644" fill="#ffffff"/>
<text x="160" y="24" font-size="18" fill="#173c50" text-anchor="middle" font-weight="600">输入抬高后</text><text x="160" y="48" font-size="18" fill="#173c50" text-anchor="middle" font-weight="600">什么让输出停下来？</text><g fill="none" stroke="#566976" stroke-width="1.4" marker-end="url(#sf-feedback-arrow)"><path d="M184 132V172"/><path d="M184 236V276"/><path d="M184 340V380"/></g><path d="M72 412H32Q24 412 24 404V108Q24 100 32 100H70" fill="none" stroke="#126e63" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#sf-feedback-arrow-accent)"/><rect x="72" y="68" width="224" height="64" rx="6" fill="#ffffff" stroke="#566976"/><text x="184" y="95" font-size="16" fill="#173c50" text-anchor="middle" font-weight="600">vgs = vi − vo</text><text x="184" y="117" font-size="13" fill="#566976" text-anchor="middle" font-weight="400">输入阶跃，vo 起初不变</text><rect x="72" y="172" width="224" height="64" rx="6" fill="#ffffff" stroke="#566976"/><text x="184" y="199" font-size="16" fill="#173c50" text-anchor="middle" font-weight="600">沟道电流增加</text><text x="184" y="221" font-size="13" fill="#566976" text-anchor="middle" font-weight="400">ΔiD ≈ gm Δvgs</text><rect x="72" y="276" width="224" height="64" rx="6" fill="#ffffff" stroke="#566976"/><text x="184" y="303" font-size="16" fill="#173c50" text-anchor="middle" font-weight="600">净电流给输出电容充电</text><text x="184" y="325" font-size="13" fill="#566976" text-anchor="middle" font-weight="400">偏置源仍取原来的电流</text><rect x="72" y="380" width="224" height="64" rx="6" fill="#f2f8f5" stroke="#126e63"/><text x="184" y="407" font-size="16" fill="#173c50" text-anchor="middle" font-weight="600">源极输出 vo 上升</text><text x="184" y="429" font-size="13" fill="#566976" text-anchor="middle" font-weight="400">反过来减小 Δvgs</text><text x="160" y="488" font-size="15" fill="#126e63" text-anchor="middle" font-weight="600">输入固定后：推动电流逐渐减小</text><text x="160" y="516" font-size="15" fill="#173c50" text-anchor="middle" font-weight="400">直到流入与流出重新平衡</text><line x1="24" y1="544" x2="296" y2="544" stroke="#d5e0e8"/><text x="24" y="572" font-size="13" fill="#566976" text-anchor="start" font-weight="400">实线：最初的因果方向</text><text x="24" y="596" font-size="13" fill="#566976" text-anchor="start" font-weight="400">虚线：输出对栅源电压的反作用</text><text x="24" y="624" font-size="13" fill="#566976" text-anchor="start" font-weight="400">饱和区小扰动；暂忽略体效应与 ro</text>
</svg>
