<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 688" role="img" aria-labelledby="mos-charge-title mos-charge-desc" id="mos-charge-root">
<title id="mos-charge-title">从耗尽到反型</title><desc id="mos-charge-desc">正栅压排斥空穴，留下固定受主电荷；继续升高栅压后，表面形成可移动的电子反型层。</desc><defs>
      <style>#mos-charge-root { color: #173c50; font-family: "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif; }
      #mos-charge-root .diagram-container { max-width:420px;min-width:0;margin:auto;overflow-x:auto }
      #mos-charge-root text { font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif }
      @media print {
#mos-charge-root .diagram-container { overflow:visible }
}</style><marker id="mos-charge-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#566976"/></marker><marker id="mos-charge-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#126e63"/></marker><marker id="mos-charge-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#315bc5"/></marker></defs>
<rect width="320" height="688" fill="#ffffff"/>
<text x="160" y="28" font-size="20" fill="#173c50" text-anchor="middle" font-weight="600">从耗尽到反型</text><text x="24" y="72" font-size="17" fill="#173c50" text-anchor="start" font-weight="600">耗尽：空穴被排斥</text><rect x="48" y="92" width="224" height="36" rx="0" fill="#eff4f8" stroke="#566976"/><text x="160" y="116" font-size="15" fill="#173c50" text-anchor="middle" font-weight="400">G：正栅压</text><rect x="48" y="128" width="224" height="28" rx="0" fill="#ffffff" stroke="#566976"/><text x="160" y="148" font-size="14" fill="#566976" text-anchor="middle" font-weight="400">绝缘氧化层</text><rect x="48" y="156" width="224" height="56" rx="0" fill="#eff4f8" stroke="#566976"/><text x="160" y="179" font-size="15" fill="#566976" text-anchor="middle" font-weight="400">A−   A−   A−   A−</text><text x="160" y="201" font-size="14" fill="#566976" text-anchor="middle" font-weight="400">耗尽区：固定受主离子</text><rect x="48" y="212" width="224" height="36" rx="0" fill="#ffffff" stroke="#566976"/><text x="160" y="236" font-size="15" fill="#173c50" text-anchor="middle" font-weight="400">p 型体区 · B = 0</text><text x="24" y="352" font-size="17" fill="#126e63" text-anchor="start" font-weight="600">反型：电子层出现</text><rect x="48" y="372" width="224" height="36" rx="0" fill="#eff4f8" stroke="#566976"/><text x="160" y="396" font-size="15" fill="#173c50" text-anchor="middle" font-weight="400">G：更高的正栅压</text><rect x="48" y="408" width="224" height="28" rx="0" fill="#ffffff" stroke="#566976"/><text x="160" y="428" font-size="14" fill="#566976" text-anchor="middle" font-weight="400">绝缘氧化层</text><rect x="48" y="436" width="224" height="28" rx="0" fill="#f2f8f5" stroke="#126e63"/><text x="160" y="456" font-size="15" fill="#126e63" text-anchor="middle" font-weight="400">e−   e−   e−   e−   e−</text><rect x="48" y="464" width="224" height="56" rx="0" fill="#eff4f8" stroke="#566976"/><text x="160" y="487" font-size="15" fill="#566976" text-anchor="middle" font-weight="400">A−   A−   A−   A−</text><text x="160" y="509" font-size="14" fill="#566976" text-anchor="middle" font-weight="400">耗尽区：固定受主离子</text><rect x="48" y="520" width="224" height="36" rx="0" fill="#ffffff" stroke="#566976"/><text x="160" y="544" font-size="15" fill="#173c50" text-anchor="middle" font-weight="400">p 型体区 · B = 0</text><path d="M160 268V316" fill="none" stroke="#566976" marker-end="url(#mos-charge-arrow)"/><rect x="176" y="280" width="112" height="24" rx="2" fill="#ffffff" stroke="#ffffff"/><text x="180" y="298" font-size="14" fill="#566976" text-anchor="start" font-weight="400">继续升高 VG</text><path d="M24 100V200M24 380V508" stroke="#126e63" marker-end="url(#mos-charge-arrow-accent)"/><line x1="24" y1="592" x2="296" y2="592" stroke="#d5e0e8"/><text x="24" y="620" font-size="13" fill="#566976" text-anchor="start" font-weight="400">箭头：栅指向体区的电场分量</text><text x="24" y="644" font-size="13" fill="#566976" text-anchor="start" font-weight="400">概念分层 · 不按物理尺寸比例</text><text x="24" y="668" font-size="13" fill="#566976" text-anchor="start" font-weight="400">源、漏与接触在图外；VDS ≈ 0</text>
</svg>
