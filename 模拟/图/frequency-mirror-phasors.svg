<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 660" width="480" height="660" role="img"><title>直接电流与镜像电流按相量相加</title><desc>独立于工艺的简化模型。理想尾源，固定gm，只保留镜像节点对地电容。直接路径相量归一为1，蓝色镜像箭头接在直接箭头末端；黑色虚线从原点指向矢量和。在角频率乘镜像时间常数为1和10时，合成分别约1.581角负18.4度与1.015角负5.6度。尚未乘输出节点阻抗。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;stroke:none}path,circle{vector-effect:non-scaling-stroke}</style><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#203b4a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><text x="22" y="30" font-size="23" fill="#203b4a" text-anchor="start">镜像开始滞后，两路怎样相加</text><text x="22" y="61" font-size="20" fill="#127b70" text-anchor="start">直接 M2：1</text><text x="216" y="61" font-size="18" fill="#315bc5" text-anchor="start">镜像 M4：1 / (1 + jωτX)</text><text x="22" y="96" font-size="21" fill="#203b4a" text-anchor="start">低频：1 + 1 = 2，两项同相。</text><text x="22" y="134" font-size="21" fill="#203b4a" text-anchor="start">ωτX = 1 · 镜像落后 45.0°</text><path d="M82 151L82 288" stroke="#d5e0e8"/><path d="M60 194L405 194" stroke="#d5e0e8"/><text x="403" y="183" font-size="17" fill="#5a7381" text-anchor="start">Re</text><text x="34" y="163" font-size="17" fill="#5a7381" text-anchor="start">Im</text><path d="M82.0 194.0L227.0 194.0" stroke="#127b70"/><path d="M217.0 190.0L227.0 194.0L217.0 198.0" stroke="#127b70"/><path d="M227.0 194.0L299.5 266.5" stroke="#315bc5"/><path d="M295.25735931288074 256.6005050633883L299.5 266.5L289.6005050633883 262.25735931288074" stroke="#315bc5"/><path d="M82.0 194.0L299.5 266.5" stroke="#203b4a" stroke-dasharray="5 5"/><path d="M291.2780780835622 259.54298914762956L299.5 266.5L288.7482559554275 267.13245553203365" stroke="#203b4a"/><text x="153" y="179" font-size="18" fill="#127b70" text-anchor="start">直接</text><text x="318" y="246" font-size="19" fill="#315bc5" text-anchor="start">镜像 0.707</text><text x="22" y="322" font-size="22" fill="#203b4a" text-anchor="start">合成：1.581 ∠ -18.4°</text><text x="22" y="366" font-size="21" fill="#203b4a" text-anchor="start">ωτX = 10 · 镜像落后 84.3°</text><path d="M82 383L82 520" stroke="#d5e0e8"/><path d="M60 426L405 426" stroke="#d5e0e8"/><text x="403" y="415" font-size="17" fill="#5a7381" text-anchor="start">Re</text><text x="34" y="395" font-size="17" fill="#5a7381" text-anchor="start">Im</text><path d="M82.0 426.0L227.0 426.0" stroke="#127b70"/><path d="M217.0 422.0L227.0 426.0L217.0 430.0" stroke="#127b70"/><path d="M227.0 426.0L228.43564356435644 440.35643564356434" stroke="#315bc5"/><path d="M231.42075513498642 430.00804886538043L228.43564356435644 440.35643564356434L223.4604576133065 430.80407861754844" stroke="#315bc5"/><path d="M82.0 426.0L228.43564356435644 440.35643564356434" stroke="#203b4a" stroke-dasharray="5 5"/><path d="M218.87364400928212 435.3998073027707L228.43564356435644 440.35643564356434L218.09307261703114 443.36163550373055" stroke="#203b4a"/><text x="153" y="411" font-size="18" fill="#127b70" text-anchor="start">直接</text><text x="318" y="478" font-size="19" fill="#315bc5" text-anchor="start">镜像 0.100</text><text x="22" y="554" font-size="22" fill="#203b4a" text-anchor="start">合成：1.015 ∠ -5.6°</text><text x="22" y="604" font-size="19" fill="#5a7381" text-anchor="start">以 I0 = gn vid / 2 为单位；黑虚线为合成。</text><text x="22" y="637" font-size="19" fill="#5a7381" text-anchor="start">输出电压 = 合成电流 / (Go + sCo)。</text></g></svg>
