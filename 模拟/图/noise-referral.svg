<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 624" role="img" aria-labelledby="noise-referral-title noise-referral-desc" id="noise-referral-root">
<title id="noise-referral-title">信号与噪声的输入参考</title><desc id="noise-referral-desc">确定性输入经信号增益产生输出信号，内部噪声经各自路径产生输出噪声；二者分开计算，再用信号增益的模平方定义输入参考噪声。</desc><defs>
      <style>#noise-referral-root { color: #173c50; font-family: "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif; }
      #noise-referral-root .diagram-container { max-width:420px;min-width:0;margin:auto;overflow-x:auto }
      #noise-referral-root text { font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;stroke:none }
      @media print {
#noise-referral-root .diagram-container { overflow:visible }
}</style><marker id="noise-referral-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#566976"/></marker><marker id="noise-referral-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#126e63"/></marker><marker id="noise-referral-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#315bc5"/></marker></defs>
<rect width="320" height="624" fill="#ffffff"/>
<text x="160" y="28" font-size="19" fill="#173c50" text-anchor="middle" font-weight="600">同一输出端口，分开计算</text><path d="M80 100V144M80 208V252" fill="none" stroke="#566976" marker-end="url(#noise-referral-arrow)"/><path d="M240 100V144M240 208V252" fill="none" stroke="#566976" marker-end="url(#noise-referral-arrow)"/><rect x="24" y="144" width="112" height="64" rx="4" fill="#ffffff" stroke="#173c50"/><rect x="184" y="144" width="112" height="64" rx="4" fill="#ffffff" stroke="#173c50"/><text x="80" y="70" font-size="17" fill="#173c50" text-anchor="middle" font-weight="400">信号 vi</text><text x="240" y="70" font-size="16" fill="#173c50" text-anchor="middle" font-weight="400">内部噪声 nk</text><text x="80" y="184" font-size="20" fill="#173c50" text-anchor="middle" font-weight="400">Av(f)</text><text x="240" y="184" font-size="20" fill="#173c50" text-anchor="middle" font-weight="400">Hk(f)</text><text x="80" y="280" font-size="20" fill="#173c50" text-anchor="middle" font-weight="400">vo,s</text><text x="240" y="280" font-size="20" fill="#173c50" text-anchor="middle" font-weight="400">vo,nk</text><text x="24" y="324" font-size="17" fill="#173c50" text-anchor="start" font-weight="400">信号幅值：vo,s = Av·vi</text><text x="24" y="360" font-size="16" fill="#173c50" text-anchor="start" font-weight="400">噪声 PSD：Sv,o = Σ |Hk|²Sk</text><text x="24" y="390" font-size="14" fill="#566976" text-anchor="start" font-weight="400">上式对不相关源求和。</text><rect x="24" y="424" width="272" height="96" rx="4" fill="#f2f8f5" stroke="#126e63"/><text x="160" y="452" font-size="16" fill="#126e63" text-anchor="middle" font-weight="400">折回同一个信号输入端口</text><text x="160" y="488" font-size="20" fill="#126e63" text-anchor="middle" font-weight="400">Sv,in = Sv,o / |Av|²</text><line x1="24" y1="544" x2="296" y2="544" stroke="#d5e0e8"/><text x="24" y="573" font-size="14" fill="#566976" text-anchor="start" font-weight="400">箭头表示传递关系，不是电路导线。</text><text x="24" y="600" font-size="14" fill="#566976" text-anchor="start" font-weight="400">同源多路径先合并 H，再求模平方。</text>
</svg>
