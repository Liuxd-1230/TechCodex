<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 335" width="720" height="335" role="img"><title>内部噪声经各自传递函数到输出，统一用信号端口增益折回输入</title><desc>TechCodex original teaching schematic. D, G, S, B are explicitly distinguished. Colored arrows show perturbations, not wires.</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;stroke:none}path,circle{vector-effect:non-scaling-stroke}</style><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#203b4a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="260" y="55" width="155" height="60" rx="3"/><rect x="260" y="190" width="155" height="60" rx="3"/><rect x="540" y="110" width="140" height="80" rx="3"/><text x="338" y="93" font-size="22" fill="#203b4a" text-anchor="middle">Av(f)</text><text x="338" y="228" font-size="22" fill="#203b4a" text-anchor="middle">Hk(f)</text><text x="610" y="143" font-size="18" fill="#203b4a" text-anchor="middle">同一输出</text><text x="610" y="174" font-size="20" fill="#315bc5" text-anchor="middle">Sv,o(f)</text><path d="M80 85L250 85" stroke="#203b4a"/><path d="M240.0 81.0L250 85L240.0 89.0" stroke="#203b4a"/><text x="90" y="60" font-size="20" fill="#203b4a" text-anchor="start">信号 vi</text><path d="M80 220L250 220" stroke="#315bc5"/><path d="M240.0 216.0L250 220L240.0 224.0" stroke="#315bc5"/><text x="90" y="195" font-size="20" fill="#315bc5" text-anchor="start">内部源 nk</text><path d="M415 85L490 85" stroke="#203b4a"/><path d="M490 85L490 150" stroke="#203b4a"/><path d="M490 150L530 150" stroke="#203b4a"/><path d="M490 150L535 150" stroke="#203b4a"/><path d="M525.0 146.0L535 150L525.0 154.0" stroke="#203b4a"/><path d="M415 220L490 220" stroke="#315bc5"/><path d="M490 220L490 150" stroke="#315bc5"/><circle cx="490" cy="150" r="3.5" fill="#203b4a" stroke="none"/><text x="55" y="303" font-size="22" fill="#127b70" text-anchor="start">输入参考：Sv,in(f) = Sv,o(f) / |Av(f)|²</text></g></svg>
