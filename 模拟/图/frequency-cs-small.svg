<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="680" height="390" role="img"><title>共源级完整两节点小信号电路：所有电容均与方程逐项对应</title><desc>Original two-node small-signal circuit: input through RS to gate node, Ci to ground, Cf between gate and output. Output has Ro and Co to ground, and a downward controlled current gm times vg.</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;stroke:none}path,circle{vector-effect:non-scaling-stroke}</style><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#203b4a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><text x="20" y="40" font-size="20" fill="#203b4a" text-anchor="start">vin → RS → vg</text><text x="455" y="40" font-size="20" fill="#127b70" text-anchor="start">vo</text><path d="M25 90L60 90" stroke="#203b4a"/><path d="M60 90L70 80" stroke="#203b4a"/><path d="M70 80L82 100" stroke="#203b4a"/><path d="M82 100L94 80" stroke="#203b4a"/><path d="M94 80L106 100" stroke="#203b4a"/><path d="M106 100L118 80" stroke="#203b4a"/><path d="M118 80L130 90" stroke="#203b4a"/><path d="M130 90L170 90" stroke="#203b4a"/><text x="75" y="65" font-size="18" fill="#203b4a" text-anchor="start">RS</text><circle cx="170" cy="90" r="3.5" fill="#203b4a" stroke="none"/><path d="M170 90L170 140" stroke="#203b4a"/><path d="M170 140L170 165" stroke="#203b4a"/><path d="M156 165L184 165" stroke="#203b4a"/><path d="M156 173L184 173" stroke="#203b4a"/><path d="M170 173L170 200" stroke="#203b4a"/><text x="191" y="175" font-size="19" fill="#203b4a" text-anchor="start">Ci</text><path d="M170 200L170 208" stroke="#203b4a"/><path d="M157 208L183 208" stroke="#203b4a"/><path d="M162 215L178 215" stroke="#203b4a"/><path d="M167 222L173 222" stroke="#203b4a"/><path d="M170 90L318.5 90.0" stroke="#203b4a"/><path d="M326.5 90.0L475 90" stroke="#203b4a"/><path d="M318.5 102.0L318.5 78.0" stroke="#203b4a"/><path d="M326.5 102.0L326.5 78.0" stroke="#203b4a"/><text x="300" y="65" font-size="19" fill="#127b70" text-anchor="start">Cf = Cgd</text><circle cx="475" cy="90" r="3.5" fill="#203b4a" stroke="none"/><path d="M475 90L610 90" stroke="#203b4a"/><path d="M610 90L610 140" stroke="#203b4a"/><path d="M610 140L610 165" stroke="#203b4a"/><path d="M596 165L624 165" stroke="#203b4a"/><path d="M596 173L624 173" stroke="#203b4a"/><path d="M610 173L610 200" stroke="#203b4a"/><text x="631" y="175" font-size="19" fill="#203b4a" text-anchor="start">Co</text><path d="M610 200L610 208" stroke="#203b4a"/><path d="M597 208L623 208" stroke="#203b4a"/><path d="M602 215L618 215" stroke="#203b4a"/><path d="M607 222L613 222" stroke="#203b4a"/><path d="M475 90L475 140" stroke="#203b4a"/><path d="M475 140L475 150" stroke="#203b4a"/><path d="M475 150L468 155.0" stroke="#203b4a"/><path d="M468 155.0L482 162.66666666666666" stroke="#203b4a"/><path d="M482 162.66666666666666L468 170.33333333333334" stroke="#203b4a"/><path d="M468 170.33333333333334L482 178.0" stroke="#203b4a"/><path d="M482 178.0L468 185.66666666666666" stroke="#203b4a"/><path d="M468 185.66666666666666L482 193.33333333333334" stroke="#203b4a"/><path d="M482 193.33333333333334L475 206" stroke="#203b4a"/><path d="M475 206L475 216" stroke="#203b4a"/><text x="493" y="184.0" font-size="19" fill="#203b4a" text-anchor="start">Ro</text><path d="M475 216L475 224" stroke="#203b4a"/><path d="M462 224L488 224" stroke="#203b4a"/><path d="M467 231L483 231" stroke="#203b4a"/><path d="M472 238L478 238" stroke="#203b4a"/><path d="M350 140L350 155" stroke="#203b4a"/><path d="M350 155l24 27l-24 27l-24 -27Z"/><path d="M350 170L350 194" stroke="#203b4a"/><path d="M354.0 184.0L350 194L346.0 184.0" stroke="#203b4a"/><path d="M350 209L350 224" stroke="#203b4a"/><text x="385" y="188" font-size="19" fill="#203b4a" text-anchor="start">gm vg</text><path d="M350 224L350 232" stroke="#203b4a"/><path d="M337 232L363 232" stroke="#203b4a"/><path d="M342 239L358 239" stroke="#203b4a"/><path d="M347 246L353 246" stroke="#203b4a"/><path d="M475 115L350 115" stroke="#203b4a"/><path d="M350 115L350 140" stroke="#203b4a"/><circle cx="475" cy="115" r="3.5" fill="#203b4a" stroke="none"/><text x="25" y="320" font-size="18" fill="#5a7381" text-anchor="start">Ci = Cgs + 外接输入电容；Co = Cdb + CL。</text><text x="25" y="352" font-size="17" fill="#5a7381" text-anchor="start">输出受控源向下；Cf 的位移电流提供另一条输入到输出的路径。</text></g></svg>
