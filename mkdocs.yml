site_name: TechCodex
site_description: 从零开始的模电生活 · 理解模拟 CMOS 电路为何这样设计
site_url: https://liuxd-1230.github.io/TechCodex/
repo_url: https://github.com/Liuxd-1230/TechCodex
repo_name: TechCodex 源码
edit_uri: blob/main/
docs_dir: build/book-source
site_dir: site
use_directory_urls: true
not_in_nav: |
  /about/roadmap.md
  /about/validation-v1.md
  /about/edition2.md
  /about/site.md
  /about/validation-v2.md
theme:
  name: material
  language: zh
  custom_dir: web/overrides
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.action.view
plugins:
  - search:
      jieba_dict_user: web/search_terms.txt
hooks:
  - web/hooks.py
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 2-3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - assets/book.css
  - assets/demos/circuit-demo.css
extra_javascript:
  - assets/book.js
nav:
  - 阅读起点: index.md
  - 从零开始的模电生活:
    - analog/index.md
    - 符号与模型: analog/conventions.md
    - 第 2 章 · MOS 器件:
      - 电场、电荷与电流: analog/devices/index.md
      - 非理想效应与设计取舍: analog/devices/nonideal.md
      - 小信号模型与电容: analog/devices/small-signal.md
    - 第 3 章 · 单级放大器:
      - analog/stages/index.md
      - 3.1 端口与分析方法: analog/stages/analysis.md
      - 3.2 共源级与负载: analog/stages/common-source.md
      - 3.3 源跟随器: analog/stages/source-follower.md
      - 3.4 共栅级: analog/stages/common-gate.md
      - 3.5 共源共栅: analog/stages/cascode.md
    - 第 4 章 · 差分放大器:
      - analog/differential/index.md
      - 4.1 电流如何分配: analog/differential/current-steering.md
      - 4.2 对称性与差模增益: analog/differential/symmetry.md
      - 4.3 共模与尾源: analog/differential/common-mode.md
      - 4.4 余量与线性范围: analog/differential/headroom.md
      - 4.5 MOS 负载: analog/differential/mos-loads.md
      - 4.6 Gilbert 单元: analog/differential/gilbert.md
    - 第 5 章 · 电流镜与偏置:
      - analog/mirrors/index.md
      - 5.1 普通电流镜: analog/mirrors/basic.md
      - 5.2 共源共栅电流镜: analog/mirrors/cascode.md
      - 5.3 有源镜与五管 OTA: analog/mirrors/active-load.md
      - 5.4 偏置与启动: analog/mirrors/biasing.md
      - 5.5 从指标到电路: analog/mirrors/design.md
    - 第 6 章 · 频率响应:
      - analog/frequency/index.md
      - 6.1 节点、电荷与极点: analog/frequency/nodes.md
      - 6.2 米勒效应与共源级: analog/frequency/miller.md
      - 6.3 源跟随与共栅: analog/frequency/follower-gate.md
      - 6.4 共源共栅: analog/frequency/cascode.md
      - 6.5 差分结构的动态: analog/frequency/differential.md
      - 6.6 五管 OTA 进入频域: analog/frequency/ota.md
      - 6.7 近似与设计判断: analog/frequency/methods.md
    - 第 7 章 · 噪声:
      - analog/noise/index.md
      - 7.1 随机过程与频谱: analog/noise/statistics.md
      - 7.2 器件与等效输入: analog/noise/sources.md
      - 7.3 单级放大器的噪声: analog/noise/stages.md
      - 7.4 镜像、差分与相关: analog/noise/mirrors-differential.md
      - 7.5 带宽与积分: analog/noise/bandwidth.md
      - 7.6 噪声预算与设计: analog/noise/design.md
  - 实验与复现:
    - labs/index.md
    - Windows 环境: labs/windows.md
    - GF180MCU 模型: labs/models.md
    - 差分对实验: labs/differential.md
    - 电流镜与 OTA 实验: labs/mirrors.md
    - 频率响应实验: labs/frequency.md
    - 噪声实验: labs/noise.md
  - 资料与路线:
    - 知识覆盖与后续章节: about/curriculum.md
    - 第 2～7 章教例地图: about/examples.md
    - 资料来源: about/sources.md
copyright: 原创文字与图示 © TechCodex · 开源实验可独立复现
